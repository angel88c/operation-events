version: "3.8"

services:
  app:
    image: streamlit-app:latest
    ports:
      - "3001:3001"
    environment:
      - ENABLE_AUTH=false
      - STREAMLIT_SERVER_PORT=3001
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
